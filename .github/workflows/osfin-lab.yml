name: Osfin Lab

on:
  pull_request:
  push:
    branches: ["lab/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osfin-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run typecheck
      - name: App, edge-function and harness regression tests
        run: npm run test:unit:app -- --run --maxWorkers=2
        env:
          CI: "1"
      - name: Build synthetic browser demo
        run: npm run build:demo
        env:
          NODE_ENV: CI
